<!-- TESTIMONIALS: hidden until real quotes exist.

         the person's first name and what they use, with their permission. Never invent quotes. -->

      <div class="h2-inner h2-wide">
        <div class="h2-kicker">In their words</div>
        <h2 class="h2-title">What people are saying</h2>
        <div class="h2-rule"></div>
        <div class="h2-quotes">
          <figure class="h2-qcard"><blockquote>"Quote goes here."</blockquote><figcaption>First name · Paper &amp; Prosperity</figcaption></figure>
          <figure class="h2-qcard"><blockquote>"Quote goes here."</blockquote><figcaption>First name · Empire Life Dashboard</figcaption></figure>
          <figure class="h2-qcard"><blockquote>"Quote goes here."</blockquote><figcaption>First name · Etsy customer</figcaption></figure>
        </div>
      </div>
